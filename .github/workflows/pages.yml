name: Build and deploy site

# Builds the FAAV Wing Studies site (landing page + atlas) from atlas/data and
# deploys it to GitHub Pages on every push to main. Pull requests only build and test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate study specs and results
        run: python -m wingstudy validate --all
      - name: Study tests (standard library only)
        run: python -m unittest discover -s tests -p "test_studies.py" -v
      - name: Study builder validator matches Python
        run: node tests/builder.test.cjs
      - name: Build site
        run: python tools/build_site.py --out _site
      - name: Atlas UI checks (mocked DOM)
        run: node tests/atlas_ui.test.cjs _site/atlas/index.html
      - name: Every media file the atlas references exists
        run: python tools/check_site.py _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
